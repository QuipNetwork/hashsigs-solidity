[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615" # u64::MAX
# Strip solc metadata from every artifact (inherited by all profiles).
# Deploys go through the pre-deployed CreateX singleton (see
# DeployBase.s.sol), so no compiled artifact is address-load-bearing —
# a CREATE3 child address is f(CREATEX, salt) only, independent of any
# build setting. Metadata stripping remains so each artifact's RUNTIME
# codehash (the (address, codehash) pair consumers pin from
# DEPLOYMENTS.md) is chain- and source-path-invariant; it still depends
# on the solc version and optimizer settings, which the production
# profiles pin. Etherscan source verification does not need the
# metadata hash.
bytecode_hash = "none"
cbor_metadata = false
# Suppress solc warning 2018 ("state mutability can be restricted to pure")
# in addition to Foundry's defaults. Under the hash-suite seam (mechanism
# (c), [DESIGN §5.1]) the shared verifier stack is declared `view` so it can
# call the SHA-256 suite's staticcall-based helpers; under a keccak build the
# same functions reach only pure keccak256, so solc would flag them as
# restrictable to pure. The widening is deliberate and source-only (keccak
# bytecode is bit-identical), and the lost compiler-enforced statelessness is
# replaced by the vm.record zero-storage guard (HashSuiteStatelessGuard).
# solc has no per-function suppression for 2018, so it is ignored globally.
# The remaining entries are Foundry's own defaults, restated because setting
# this key replaces (not extends) them.
ignored_error_codes = [
    "license",
    "code-size",
    "init-code-size",
    "transient-storage",
    "transfer-deprecated",
    "natspec-memory-safe-assembly-deprecated",
    2018,
]
# Profile selection ([DESIGN §3.4]): the `shrincs-profile/` prefix
# resolves to the active profile's SHRINCSParams library. Default is
# the 256s profile. Other profiles override this remapping AND the
# `out` dir. The `shrincs-hash/` prefix selects the hash suite (keccak
# by default); a future SHA-256 suite remaps it to contracts/hash/sha2/.
# Foundry replaces (not merges) the remapping array per profile, so
# every profile that overrides remappings lists both axes. WARNING: a
# top-level remappings.txt silently overrides these per-profile TOML
# remappings (verified hazard, [DESIGN §2(d′)]); the profile-identity
# test + CI guard (T3) fail closed if one exists.
remappings = [
    "shrincs-profile/=contracts/profiles/256s/",
    "shrincs-hash/=contracts/hash/keccak/",
]
# The concrete per-profile verifiers and their deploy scripts each
# compile only under their own profile (so the artifact carries the
# right constants). Default is 256s, so skip the 128s SHRINCS and
# SPHINCSPlusC verifiers and their deploy scripts here; each SHRINCS
# verifier and its SPHINCSPlusC sibling build in the SAME profile (the
# SHRINCS one pins the sibling's address). [profile.production] inherits
# this skip.
skip = [
    "contracts/SHRINCS128sQ18Keccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC128sQ18Keccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS128sQ18Keccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ18Keccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
    "contracts/SHRINCS256sSha2.sol",
    "contracts/SPHINCSPlusC256sSha2.sol",
    "script/DeploySHRINCS256sSha2.s.sol",
    "script/DeploySPHINCSPlusC256sSha2.s.sol",
    "test/SHRINCSPinned128sQ18.t.sol",
    "test/SHRINCSPinned128sQ20.t.sol",
    "test/SHRINCSPinned256sSha2.t.sol",
    "test/HashSuiteStatelessGuardSha2.t.sol",
    "test/SHRINCSSphincs128sVectors.t.sol",
    "test/SHRINCSSphincs256sSha2Vectors.t.sol",
]

ffi = true
fs_permissions = [
    { access = "read-write", path = "./test/test_vectors/" },
    # Read access to every profile's build artifacts: SHRINCSMeasurements
    # (task 1vn) selects its profile-gated harness contracts (e.g.
    # SHRINCSPinned256s.t.sol:SHRINCS256sPinHarness) by artifact-name
    # string via deployCode, and vm.getCode only auto-allows artifacts
    # compiled from `src` (contracts/); test/-sourced artifacts need an
    # explicit grant. Each profile builds into its own `out*` dir
    # ([profile.*] `out`) so every one needs its own entry.
    { access = "read", path = "./out" },
    { access = "read", path = "./out-128s-q18" },
    { access = "read", path = "./out-128s-q20" },
    { access = "read", path = "./out-256s-sha2" },
    { access = "read", path = "./out-128s-q18-sha2" },
    { access = "read", path = "./out-128s-q20-sha2" }
]

[profile.production]
# solc is PINNED so the 256s verifier's RUNTIME CODEHASH is chain-
# invariant (consumers pin the codehash from DEPLOYMENTS.md). Deploys
# use CREATE3 through CreateX, so the deployed ADDRESS depends only on
# (CREATEX, salt) and is independent of the init code — but the pin
# still fixes the codehash across chains. Inherits the
# [profile.default] remapping
# (256s) and skip (128s verifiers/deploys). Bump deliberately.
solc = "0.8.35"
via_ir = true
optimizer = true
optimizer_runs = 1000000
gas_limit = "18446744073709551615" # u64::MAX

# 128s profiles ([DESIGN §3.4]). Each overrides the `shrincs-profile/`
# remapping and uses its own `out` dir so artifacts never collide.
# `skip` excludes the 256s-specific tests: those either read the
# Rust-anchored 256s vectors or run the in-Solidity stateless signer
# (full 2^a FORS trees + fixed 8-layer hypertree), which is infeasible
# at 128s (a = 24, d = 1). 128s stateless coverage lands with the
# regenerated vectors in T6 ([DESIGN §3.6]). Stateful, toy-profile,
# WOTS+, and profile-invariant tests run under every profile.
# Each 128s `skip` excludes the non-matching concrete verifiers and
# deploy scripts (so only this profile's verifier compiles, with this
# profile's constants) and the 256s-specific tests. SHRINCSMeasurements
# (task 1vn) runs here too: stateful measurements sign in-process
# (cheap at maxSignatures = 4), stateless measurements read the 128s
# vector JSON instead of signing in-process.
[profile.128s-q18]
out = "out-128s-q18"
remappings = [
    "shrincs-profile/=contracts/profiles/128s-q18/",
    "shrincs-hash/=contracts/hash/keccak/",
]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
    "contracts/SHRINCS256sSha2.sol",
    "contracts/SPHINCSPlusC256sSha2.sol",
    "script/DeploySHRINCS256sSha2.s.sol",
    "script/DeploySPHINCSPlusC256sSha2.s.sol",
    "test/SHRINCSSphincs256sVectors.t.sol",
    "test/SHRINCSSphincs256sSha2Vectors.t.sol",
    "test/SHRINCSStatelessVectorSigner.t.sol",
    "test/SHRINCSAccountSigningFacade.t.sol",
    "test/SHRINCSAccountVectorExport.t.sol",
    "test/HashSuiteStatelessGuard.t.sol",
    "test/SHRINCSAccountVerifierExample.t.sol",
    "test/SHRINCSEnvelope.t.sol",
    "test/SHRINCSStatefulPolicyExamples.t.sol",
    "test/SHRINCSStatelessSliceCopy.t.sol",
    "test/SHRINCSCalldataRetag.t.sol",
    "test/SHRINCSPinned256s.t.sol",
    "test/SHRINCSPinned128sQ20.t.sol",
    "test/SHRINCSPinned256sSha2.t.sol",
    "test/HashSuiteStatelessGuardSha2.t.sol",
]

