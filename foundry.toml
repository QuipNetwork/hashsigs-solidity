[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615" # u64::MAX
# Strip solc metadata from every artifact (inherited by all profiles).
# The CREATE3 Create3Factory address is CREATE2(canonical proxy,
# FACTORY_SALT, keccak256(factory creation code)); with metadata the
# creation code embeds each profile's remappings, so the factory —
# and every CREATE3 child — moved per profile (DEPLOYMENTS.md, "CREATE3
# factory address"). Dropping metadata makes the factory creation code
# identical across the three production profiles, so ONE factory (and
# one child address per salt) serves every suite. Consequence: runtime
# codehashes lose their metadata tail and change from any earlier
# record; SHRINCS is testnet-only and nothing is deployed, so nothing
# is burned, and Etherscan source verification does not need the
# metadata hash. Optimizer runs still differ between test (200) and
# production (1,000,000), so the test-profile factory creation code is
# NOT the production one; the pin tests derive through the pinned
# production factory init-code hash (see DeployBase.s.sol FACTORY_SALT).
bytecode_hash = "none"
cbor_metadata = false
# Profile selection ([DESIGN §3.4]): the `shrincs-profile/` prefix
# resolves to the active profile's SHRINCSParams library. Default is
# the 256s profile. Other profiles override this remapping AND the
# `out` dir. WARNING: a top-level remappings.txt silently overrides
# these per-profile TOML remappings (verified hazard, [DESIGN §2(d′)]);
# the profile-identity test + CI guard (T3) fail closed if one exists.
remappings = ["shrincs-profile/=contracts/profiles/256s/"]
# The concrete per-profile verifiers and their deploy scripts each
# compile only under their own profile (so the artifact carries the
# right constants). Default is 256s, so skip the 128s SHRINCS and
# SPHINCSPlusC verifiers and their deploy scripts here; each SHRINCS
# verifier and its SPHINCSPlusC sibling build in the SAME profile (the
# SHRINCS one pins the sibling's address). [profile.production] inherits
# this skip.
skip = [
    "contracts/SHRINCS128sQ18Keccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC128sQ18Keccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS128sQ18Keccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ18Keccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
    "test/SHRINCSPinned128sQ18.t.sol",
    "test/SHRINCSPinned128sQ20.t.sol",
]

ffi = true
fs_permissions = [
    { access = "read-write", path = "./test/test_vectors/" }
]

[profile.production]
# solc is PINNED so the 256s verifier's RUNTIME CODEHASH is chain-
# invariant (consumers pin the codehash from DEPLOYMENTS.md). Deploys
# now use CREATE3, so the deployed ADDRESS depends only on (factory,
# salt) and is independent of the init code — but the pin still fixes
# the codehash across chains. Inherits the [profile.default] remapping
# (256s) and skip (128s verifiers/deploys). Bump deliberately.
solc = "0.8.35"
via_ir = true
optimizer = true
optimizer_runs = 1000000
gas_limit = "18446744073709551615" # u64::MAX

# 128s profiles ([DESIGN §3.4]). Each overrides the `shrincs-profile/`
# remapping and uses its own `out` dir so artifacts never collide.
# `skip` excludes the 256s-specific tests: those either read the
# Rust-anchored 256s vectors or run the in-Solidity stateless signer
# (full 2^a FORS trees + fixed 8-layer hypertree), which is infeasible
# at 128s (a = 24, d = 1). 128s stateless coverage lands with the
# regenerated vectors in T6 ([DESIGN §3.6]). Stateful, toy-profile,
# WOTS+, and profile-invariant tests run under every profile.
# Each 128s `skip` excludes the non-matching concrete verifiers and
# deploy scripts (so only this profile's verifier compiles, with this
# profile's constants) and the 256s-specific tests.
[profile.128s-q18]
out = "out-128s-q18"
remappings = ["shrincs-profile/=contracts/profiles/128s-q18/"]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
    "test/SHRINCSSphincs256sVectors.t.sol",
    "test/SHRINCSStatelessVectorSigner.t.sol",
    "test/SHRINCSAccountEnvelopeCanonicity.t.sol",
    "test/SHRINCSAccountSigningFacade.t.sol",
    "test/SHRINCSAccountVectorExport.t.sol",
    "test/SHRINCSMeasurements.t.sol",
    "test/SHRINCSAccountVerifierExample.t.sol",
    "test/SHRINCSCodec.t.sol",
    "test/SHRINCSStatefulPolicyExamples.t.sol",
    "test/SHRINCSStatelessDelegation.t.sol",
    "test/SHRINCSCodecCanonicity.t.sol",
    "test/SHRINCSPinned256s.t.sol",
    "test/SHRINCSPinned128sQ20.t.sol",
]

[profile.128s-q20]
out = "out-128s-q20"
remappings = ["shrincs-profile/=contracts/profiles/128s-q20/"]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ18Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ18Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ18Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ18Keccak.s.sol",
    "test/SHRINCSSphincs256sVectors.t.sol",
    "test/SHRINCSStatelessVectorSigner.t.sol",
    "test/SHRINCSAccountEnvelopeCanonicity.t.sol",
    "test/SHRINCSAccountSigningFacade.t.sol",
    "test/SHRINCSAccountVectorExport.t.sol",
    "test/SHRINCSMeasurements.t.sol",
    "test/SHRINCSAccountVerifierExample.t.sol",
    "test/SHRINCSCodec.t.sol",
    "test/SHRINCSStatefulPolicyExamples.t.sol",
    "test/SHRINCSStatelessDelegation.t.sol",
    "test/SHRINCSCodecCanonicity.t.sol",
    "test/SHRINCSPinned256s.t.sol",
    "test/SHRINCSPinned128sQ18.t.sol",
]

# Production twins of the 128s profiles: same solc/via-ir/runs pin as
# [profile.production], differing only in remapping, `out`, and skip
# ([DESIGN §3.4]). Used to build each profile's canonical verifier
# artifact; each skips the other profiles' verifiers and deploy scripts.
[profile.production-128s-q18]
solc = "0.8.35"
via_ir = true
optimizer = true
optimizer_runs = 1000000
gas_limit = "18446744073709551615" # u64::MAX
out = "out-128s-q18-prod"
remappings = ["shrincs-profile/=contracts/profiles/128s-q18/"]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
]

[profile.production-128s-q20]
solc = "0.8.35"
via_ir = true
optimizer = true
optimizer_runs = 1000000
gas_limit = "18446744073709551615" # u64::MAX
out = "out-128s-q20-prod"
remappings = ["shrincs-profile/=contracts/profiles/128s-q20/"]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ18Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ18Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ18Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ18Keccak.s.sol",
]

# Per-MR security gate: the 256s (default) profile plus bounded,
# deterministic fuzz/invariant runs. Inherits src/remappings/skip/
# via_ir/optimizer/gas_limit/ffi/fs_permissions from [profile.default]
# (Foundry merges the selected profile over default). Foundry >= 1.7.0
# randomizes the fuzz seed by default, so per-MR determinism requires
# pinning FOUNDRY_FUZZ_SEED in .gitlab-ci.yml; bump it deliberately in
# its own commit to rotate cases. failure_persist_dir is cached in CI so
# any counterexample a nightly (or prior MR) found replays first here.
[profile.ci]

[profile.ci.fuzz]
runs = 512
max_test_rejects = 65536
failure_persist_dir = "cache/fuzz"

[profile.ci.invariant]
runs = 64
depth = 32
fail_on_revert = true
failure_persist_dir = "cache/invariant"
shrink_run_limit = 5000

# Nightly deep campaign: the 256s (default) profile plus long randomized
# runs with a coverage-guided corpus. The nightly pipeline leaves
# FOUNDRY_FUZZ_SEED unset (random). corpus_dir enables coverage-guided
# mutation (foundry >= 1.7.0 for stateless fuzz, >= 1.3.0 for
# invariants); both corpus and failure dirs are cached across runs.
[profile.nightly]

[profile.nightly.fuzz]
runs = 65536
failure_persist_dir = "cache/fuzz"
corpus_dir = "cache/fuzz-corpus"
corpus_gzip = true

[profile.nightly.invariant]
runs = 2048
depth = 128
fail_on_revert = true
failure_persist_dir = "cache/invariant"
corpus_dir = "cache/invariant-corpus"
corpus_gzip = true
timeout = 10800 # 3h wall-clock cap per invariant test

[fmt]
# 78-char cap (CODINGSTANDARDS.md §3). Set to 77 because forge fmt
# 1.7.1 excludes the trailing token (';', '{') from its width
# accounting; 77 keeps canonical output within the 78-char hard limit
# enforced by scripts/check-line-length.sh.
line_length = 77
tab_width = 4
bracket_spacing = false
int_types = 'long'
multiline_func_header = 'attributes_first'
quote_style = 'double'
number_underscore = 'preserve'
single_line_statement_blocks = 'preserve'

[lint]
# PascalCase spec-parameter constants are codified in
# CODINGSTANDARDS.md §2 and deliberately override the style guide.
exclude_lints = ["screaming-snake-case-const"]
