# SHA-256 suite profiles ([DESIGN §3.3]). The suite axis multiplies only
# where a deployable exists: 256s-sha2 is the first (and, for now, only)
# SHA-256 deployable. Both axes are listed explicitly because Foundry
# REPLACES the remapping array per profile — `shrincs-profile/` selects the
# 256s-sha2 params duplicate, `shrincs-hash/` selects the sha2 HashSuite.
# The skip list excludes every keccak deployable/script (the sha2 twins
# compile instead). The in-Solidity test signers
# (test/helpers/SHRINCSTestSigner.sol and SHRINCSStatelessVectorSigner.sol)
# now route their scheme hashes through the HashSuite seam (task 80u), so
# under the sha2 suite the signer swaps to SHA-256 in lockstep with the
# verifier and produce-then-verify tests pass; the signing-dependent suites
# that are NOT bound to a keccak artifact are therefore un-skipped here. The
# remaining test skips (below) stay for keccak-artifact reasons, documented
# inline. 256s-sha2 coverage is: compile; the per-helper sha2 KATs
# (HashSuiteKat); the vector-backed end-to-end suite SHRINCSSphincs256sSha2
# Vectors (Rust sha2 vector through the production verifier); the seam-routed
# self-signing suites (keygen goldens anchored to the Rust sha2 signer, plus
# stateful and stateless produce-then-verify); the call-level gas suite
# SHRINCSMeasurements (profile-selected artifacts, task 1vn); and the
# non-signing structural/profile suites (incl. the params drift guard in
# SHRINCSProfileInvariants).
[profile.256s-sha2]
out = "out-256s-sha2"
remappings = [
    "shrincs-profile/=contracts/profiles/256s-sha2/",
    "shrincs-hash/=contracts/hash/sha2/",
]
skip = [
    "contracts/SHRINCS256sKeccak.sol",
    "contracts/SHRINCS128sQ18Keccak.sol",
    "contracts/SHRINCS128sQ20Keccak.sol",
    "contracts/SPHINCSPlusC256sKeccak.sol",
    "contracts/SPHINCSPlusC128sQ18Keccak.sol",
    "contracts/SPHINCSPlusC128sQ20Keccak.sol",
    "script/DeploySHRINCS256sKeccak.s.sol",
    "script/DeploySHRINCS128sQ18Keccak.s.sol",
    "script/DeploySHRINCS128sQ20Keccak.s.sol",
    "script/DeploySPHINCSPlusC256sKeccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ18Keccak.s.sol",
    "script/DeploySPHINCSPlusC128sQ20Keccak.s.sol",
    # The remaining test skips are NOT signer-hash-mismatch skips (those were
    # lifted once the in-Solidity signers were routed onto the seam, task
    # 80u). They stay skipped because they are bound to keccak artifacts:
    #  - SHRINCSSphincs256s/128sVectors read shrincs_sphincs_*_keccak.json;
    #  - Pinned* pin keccak runtime codehashes;
    #  - StatefulPolicyExamples, AccountVerifierExample, and Envelope's
    #    256s-vector-bound ERC-7913 integration half read the 256s keccak
    #    vector file (Envelope's profile-independent codec unit tests split
    #    to SHRINCSEnvelopeCodec.t.sol, which runs here; GuardPinning is now
    #    profile-keyed on its own vector JSON and runs here too);
    #  - CalldataRetag, ConsumerExamples, and HashSuiteStatelessGuard import
    #    the concrete SHRINCS256sKeccak verifier (skipped under this profile);
    #    the sha2 statelessness guard is HashSuiteStatelessGuardSha2 instead.
    #    Measurements and StatelessDelegation no longer import a concrete
    #    verifier (they select artifacts by SHRINCSParams.PROFILE_ID via
    #    deployCode) and run here instead;
    #  - AccountVectorExport, AccountInvariants, and MutationFuzz drive
    #    stateless in-Solidity signing under randomized/export loops; under the
    #    sha2 precompile path that is prohibitively slow, and their sha2
    #    correctness is already covered deterministically by the lifted
    #    SHRINCSStatelessVectorSigner / SHRINCSSignerKeygen suites.
    "test/SHRINCSSphincs256sVectors.t.sol",
    "test/SHRINCSSphincs128sVectors.t.sol",
    "test/SHRINCSPinned256s.t.sol",
    "test/SHRINCSPinned128sQ18.t.sol",
    "test/SHRINCSPinned128sQ20.t.sol",
    "test/SHRINCSStatefulPolicyExamples.t.sol",
    "test/SHRINCSAccountVerifierExample.t.sol",
    "test/SHRINCSAccountVectorExport.t.sol",
    "test/SHRINCSAccountInvariants.t.sol",
    "test/SHRINCSMutationFuzz.t.sol",
    "test/SHRINCSEnvelope.t.sol",
    "test/SHRINCSCalldataRetag.t.sol",
    "test/SHRINCSConsumerExamples.t.sol",
    "test/HashSuiteStatelessGuard.t.sol",
]

[profile.production-256s-sha2]
solc = "0.8.35"
via_ir = true
optimizer = true
optimizer_runs = 1000000
gas_limit = "18446744073709551615" # u64::MAX
out = "out-256s-sha2-prod"
remappings = [
