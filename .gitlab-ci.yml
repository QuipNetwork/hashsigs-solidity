# GitLab CI: runs the CODINGSTANDARDS.md §8 gates (format, build, lint
# with zero-warnings enforcement, hard line cap, tests). Image version is
# pinned; bump it together with local toolchains so fmt output stays
# canonical.

stages:
  - verify

variables:
  GIT_SUBMODULE_STRATEGY: recursive

.foundry:
  stage: verify
  image:
    name: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint: [""]
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - forge --version

# Profile-independent gates, run once. Format, hard line cap, and the
# profile-selection hazard guard: a top-level remappings.txt silently
# overrides the per-profile TOML remappings, so a profile build could
# compile with another profile's constants (verified hazard, design
# §2(d′)/§3.5). Per-profile remappings live only in foundry.toml; fail
# closed if a remappings.txt exists. The ShrincsProfileInvariants
# identity test is the in-Solidity backstop for the same hazard.
format-and-checks:
  extends: .foundry
  script:
    - test ! -f remappings.txt
    - forge fmt --check
    - scripts/check-line-length.sh

# Every profile must build, lint clean, and pass its test set. Lint runs
# per profile because each concrete verifier and its deploy script only
# compile under their own profile (the others are skipped); lint emits a
# cosmetic "AST source not found" note for the skipped files but exits 0.
# The 256s-specific vector/stateless tests are skipped under the 128s
# profiles via foundry.toml until the T6 vector regeneration (design
# §3.6).
build-lint-test:
  extends: .foundry
  parallel:
    matrix:
      - FOUNDRY_PROFILE: ["default", "128s-q18", "128s-q20"]
  script:
    - forge build
    - forge lint --deny warnings contracts/ test/ script/
    - forge test
