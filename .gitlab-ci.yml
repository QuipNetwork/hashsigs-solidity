# GitLab CI for the main branch: build the contracts and run the Foundry
# test suite on every merge request and on main itself.
#
# The project sets only_allow_merge_if_pipeline_succeeds, so a branch with
# no pipeline can never be merged. This file gives main a pipeline. The
# active development branch, shrincs-main, carries a much larger config
# covering format, lint, per-profile builds, Slither and nightly fuzzing;
# keep this one minimal, matching the smaller surface on main.
#
# This job does not use the ghcr.io/foundry-rs/foundry image. That image
# runs as a non-root user, and testVectors() reads
# test/test_vectors/wotsplus_keccak256.json through vm.ffi and jq, which
# the image does not ship and an unprivileged job cannot install. Use the
# same base-image-plus-foundryup pattern the slither job on shrincs-main
# uses instead. python:3.12-slim is multi-arch, so foundryup fetches the
# matching foundry binary and no runner arch tag is needed.
#
# Pin the foundry version deliberately, together with local toolchains.

stages:
  - verify

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build-and-test:
  stage: verify
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      curl git ca-certificates jq
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$HOME/.foundry/bin:$PATH"
    - foundryup --install v1.7.1
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - forge --version
    - jq --version
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - forge build
    - forge test -vv
